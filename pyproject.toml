[project]
name = "audiolivro"
version = "0.1.0"
description = "Transforma livros (EPUB, PDF, PDF escaneado, TXT) em audiobooks com capítulos, inteiramente no seu computador"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henrique Martins" }]
keywords = ["audiobook", "tts", "epub", "pdf", "ocr", "português", "text-to-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart",
]

[project.optional-dependencies]
# O motor padrão. São ~190 MB de vozes, baixados na primeira execução.
piper = ["piper-tts>=1.2"]
# Prosódia melhor, sotaque levemente americano. 350 MB de pesos.
kokoro = ["kokoro-onnx>=0.4", "espeakng-loader"]
# OCR pelo Vision do macOS, para PDF escaneado. Sem isso, PDF de imagem
# não é lido — e não há alternativa embutida.
ocr = [
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]
tudo = ["audiolivro[piper,kokoro,ocr]"]
dev = ["pytest>=8"]

[project.urls]
"Repositório" = "https://github.com/backhenry/audiolivro"
"Problemas" = "https://github.com/backhenry/audiolivro/issues"

[project.scripts]
audiolivro = "audiolivro.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audiolivro*"]

[tool.setuptools.package-data]
audiolivro = ["ui/estatico/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
